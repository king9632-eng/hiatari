<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日当たり3Dシミュレーター</title>
<style>
:root{--bg:#dfe8f0;--fg:#1c2530;--pn:rgba(255,255,255,.93);--bd:#c3ccd6;--ac:#e8890c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--fg:#e6ebf0;--pn:rgba(24,30,38,.93);--bd:#3a4552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--fg:#e6ebf0;--pn:rgba(24,30,38,.93);--bd:#3a4552;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;overflow:hidden}
body{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.box{position:absolute;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.6}
#info{left:8px;top:8px;max-width:330px}
#info b{color:var(--ac)}
#panel{left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px}
label{display:block;font-size:12px}
label b{float:right;font-size:13px}
input[type=range],select{width:100%;box-sizing:border-box;margin:3px 0 0}
select{font-size:14px;padding:4px}
button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
</style></head><body>
<canvas id="c"></canvas>
<div id="info" class="box">
 <div id="i1"></div><div id="i2"></div>
 <div style="font-size:11px;margin-top:2px"><span class="dot" style="background:#ffc400"></span> 日が当たる　<span class="dot" style="background:#3a424d"></span> 日陰（住宅の南面）</div>
</div>
<div id="panel" class="box">
 <label>エリア（都道府県）<select id="pref"></select></label>
 <label>住宅の道路からの離隔 <b id="sl"></b><input id="sb" type="range" min="1" max="10" step="0.5" value="1"></label>
 <label>日付 <b id="dl"></b><input id="day" type="range" min="1" max="365" value="356"></label>
 <label>時刻 <b id="tl"></b><input id="time" type="range" min="0" max="24" step="0.05" value="12">
  <div class="row"><button id="play">▶ 時刻を再生</button></div></label>
 <label>非住居の位置 <b id="al"></b><input id="ang" type="range" min="-180" max="180" step="10" value="0">
  <div class="row"><button data-a="0">真南</button><button data-a="90">真西</button><button data-a="-90">真東</button><button data-a="180">真北</button></div></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const P=[["北海道",43.06,141.35],["青森県",40.82,140.74],["岩手県",39.70,141.15],["宮城県",38.27,140.87],["秋田県",39.72,140.10],["山形県",38.24,140.36],["福島県",37.75,140.47],["茨城県",36.34,140.45],["栃木県",36.57,139.88],["群馬県",36.39,139.06],["埼玉県",35.86,139.65],["千葉県",35.61,140.12],["東京都",35.69,139.69],["神奈川県",35.45,139.64],["新潟県",37.90,139.02],["富山県",36.70,137.21],["石川県",36.59,136.63],["福井県",36.07,136.22],["山梨県",35.66,138.57],["長野県",36.65,138.18],["岐阜県",35.39,136.72],["静岡県",34.98,138.38],["愛知県",35.18,136.91],["三重県",34.73,136.51],["滋賀県",35.00,135.87],["京都府",35.02,135.76],["大阪府",34.69,135.52],["兵庫県",34.69,135.18],["奈良県",34.69,135.83],["和歌山県",34.23,135.17],["鳥取県",35.50,134.24],["島根県",35.47,133.05],["岡山県",34.66,133.93],["広島県",34.40,132.46],["山口県",34.19,131.47],["徳島県",34.07,134.56],["香川県",34.34,134.04],["愛媛県",33.84,132.77],["高知県",33.56,133.53],["福岡県",33.61,130.42],["佐賀県",33.25,130.30],["長崎県",32.74,129.87],["熊本県",32.79,130.74],["大分県",33.24,131.61],["宮崎県",31.91,131.42],["鹿児島県",31.56,130.56],["沖縄県",26.21,127.68]];
const $=id=>document.getElementById(id), R=Math.PI/180, sel=$('pref');
P.forEach((p,i)=>sel.add(new Option(p[0],i))); sel.value=12;

const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:$('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const cam=new THREE.PerspectiveCamera(45,1,0.5,600); cam.position.set(-32,26,44);
const ctl=new THREE.OrbitControls(cam,renderer.domElement); ctl.target.set(0,3,6); ctl.maxPolarAngle=Math.PI*0.495; ctl.update();

const hemi=new THREE.HemisphereLight(0xffffff,0x667766,0.5); scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xfff2d6,1.1); sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048); sunL.shadow.bias=-0.0005;
Object.assign(sunL.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:200}); scene.add(sunL);
const sunM=new THREE.Mesh(new THREE.SphereGeometry(2.5,16,12),new THREE.MeshBasicMaterial({color:0xffd23c})); scene.add(sunM);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshLambertMaterial({color:0x8fb27c}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

function lab(t,x,y,z,s,col){const c=document.createElement('canvas');c.width=384;c.height=128;const g=c.getContext('2d');
 g.font='bold 54px sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='rgba(0,0,0,.7)';
 g.strokeText(t,192,64);g.fillStyle=col||'#fff';g.fillText(t,192,64);
 const m=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
 m.position.set(x,y,z);m.scale.set(s,s/3,1);scene.add(m);return m;}
lab('北',0,1.5,-50,6,'#ff8a8a');lab('南',0,1.5,50,6);lab('東',50,1.5,0,6);lab('西',-50,1.5,0,6);

function edged(m){m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x222222})));m.castShadow=m.receiveShadow=true;return m;}
// 住宅 幅10m(東西) x 高さ8m x 奥行8m（南面 z=+4）
const house=edged(new THREE.Mesh(new THREE.BoxGeometry(10,8,8),new THREE.MeshLambertMaterial({color:0xf2d7a6})));
house.position.y=4; scene.add(house); lab('住宅 8m',0,9.8,0,9,'#ffe9b0');
// 非住居＋道路（住宅を中心に回転）
const bg=new THREE.Group(); scene.add(bg); const bi=new THREE.Group(); bg.add(bi);
const bm=edged(new THREE.Mesh(new THREE.BoxGeometry(20,13,10),new THREE.MeshLambertMaterial({color:0x8fa3b8})));
bm.position.set(0,6.5,15); bi.add(bm);
const road=new THREE.Mesh(new THREE.PlaneGeometry(80,6),new THREE.MeshLambertMaterial({color:0x4a4f55}));
road.rotation.x=-Math.PI/2; road.position.set(0,0.03,7); road.receiveShadow=true; bi.add(road);
const cl=new THREE.Mesh(new THREE.PlaneGeometry(80,0.15),new THREE.MeshBasicMaterial({color:0xe8e8e8}));
cl.rotation.x=-Math.PI/2; cl.position.set(0,0.05,7); bi.add(cl);
bi.add(lab('非住居 13m',0,15.2,15,10,'#cfe3ff')); bi.add(lab('道路 6m',0,1.2,7,6,'#ffffff'));

// 住宅南面の観測点（黄=日向 / 灰=日陰）
const mk=[]; [1.5,5].forEach(y=>[-4,-2,0,2,4].forEach(x=>{
 const s=new THREE.Mesh(new THREE.SphereGeometry(0.28,12,8),new THREE.MeshBasicMaterial({color:0xffc400}));
 s.position.set(x,y,4.2); scene.add(s); mk.push(s);}));

// 太陽位置（方位：南0・西+）
function sunPos(N,t,lat,lon){
 const d=23.44*R*Math.sin(2*Math.PI*(284+N)/365), B=2*Math.PI*(N-81)/364;
 const eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
 const h=(t+(lon-135)/15+eot/60-12)*15*R, f=lat*R;
 const el=Math.asin(Math.sin(f)*Math.sin(d)+Math.cos(f)*Math.cos(d)*Math.cos(h));
 const az=Math.atan2(Math.sin(h),Math.cos(h)*Math.sin(f)-Math.tan(d)*Math.cos(f));
 return {el,az};}
const toV=s=>{const c=Math.cos(s.el);return new THREE.Vector3(-Math.sin(s.az)*c,Math.sin(s.el),Math.cos(s.az)*c);};
const ray=new THREE.Raycaster();
const blocked=(p,d)=>{ray.set(p,d);return ray.intersectObject(bm).length>0;};
const fmtT=t=>{const m=Math.round(t*60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const angTxt=a=>a==0?'真南':a==90?'真西':a==-90?'真東':Math.abs(a)==180?'真北':a>0?'南→西 '+a+'°':'南→東 '+(-a)+'°';

function daily(){
 const N=+$('day').value,[,lat,lon]=P[+sel.value]; bg.updateMatrixWorld(true);
 const pts=[new THREE.Vector3(0,1.5,4.05),new THREE.Vector3(0,5,4.05)], a=[0,0], b=[0,0], st=1/6;
 for(let t=3;t<21;t+=st){const d=toV(sunPos(N,t,lat,lon)); if(d.y<=0||d.z<=0)continue;
  pts.forEach((p,i)=>{b[i]+=st; if(!blocked(p,d))a[i]+=st;});}
 $('i2').innerHTML='住宅 南面の1日の直射時間<br>2F（高さ5m）: <b>'+a[1].toFixed(1)+'時間</b>（非住居なし '+b[1].toFixed(1)+'）<br>1F（高さ1.5m）: <b>'+a[0].toFixed(1)+'時間</b>（非住居なし '+b[0].toFixed(1)+'）';
}
function upd(){
 const N=+$('day').value,t=+$('time').value,[nm,lat,lon]=P[+sel.value];
 const dt=new Date(2026,0,N); $('dl').textContent=(dt.getMonth()+1)+'月'+dt.getDate()+'日';
 $('tl').textContent=fmtT(t); $('al').textContent=angTxt(+$('ang').value); $('sl').textContent=$('sb').value+' m';
 const s=sunPos(N,t,lat,lon), d=toV(s), up=s.el>0, k=Math.max(0,Math.min(1,(s.el+0.1)/0.4));
 sunL.position.copy(d).multiplyScalar(80); sunM.position.copy(d).multiplyScalar(90);
 sunL.intensity=up?Math.min(1,s.el*5)*1.15:0; sunM.visible=up; hemi.intensity=0.22+0.35*k;
 scene.background=new THREE.Color(0x0b1226).lerp(new THREE.Color(0x9fd0f5),k);
 bg.updateMatrixWorld(true);
 mk.forEach(m=>{const lit=up&&d.z>0&&!blocked(m.position,d);m.material.color.set(lit?0xffc400:0x3a424d);});
 const az=Math.abs(s.az/R);
 $('i1').innerHTML='<b>'+nm+'</b>　'+$('dl').textContent+' '+fmtT(t)+'<br>太陽高度 <b>'+(up?(s.el/R).toFixed(1)+'°':'地平線の下')+'</b>'+(up?'　方位 '+(s.az>=0?'南から西へ ':'南から東へ ')+az.toFixed(0)+'°':'');
}
['pref','day','ang','sb'].forEach(id=>$(id).addEventListener('input',()=>{bg.rotation.y=-$('ang').value*R;bi.position.z=+$('sb').value;daily();upd();}));
$('time').addEventListener('input',upd);
document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{$('ang').value=b.dataset.a;$('ang').dispatchEvent(new Event('input'));});
let play=false; $('play').onclick=()=>{play=!play;$('play').textContent=play?'⏸ 停止':'▶ 時刻を再生';};
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',rs); bi.position.z=+$('sb').value; rs(); daily(); upd();
(function loop(){requestAnimationFrame(loop);
 if(play){$('time').value=(+$('time').value+0.03)%24;upd();}
 ctl.update();renderer.render(scene,cam);})();
</script></body></html>
